<!DOCTYPE html>
<html lang="es">
<head>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pirámide de Segmentación</title>
<link rel="icon" href="../favicon.ico" type="image/x-icon">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f1f5f9;color:#1e293b;font-size:13px}
header{background:#1d4ed8;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px}
.title-block{display:flex;flex-direction:column;flex:1}
header h1{font-size:17px;font-weight:700}
header span{font-size:12px;opacity:.75;display:block;margin-top:2px}
.filters{background:#fff;border-bottom:1px solid #e2e8f0;padding:10px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.filters label{font-size:12px;color:#475569;font-weight:600}
.filters select{padding:5px 8px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px;background:#fff;cursor:pointer;max-width:280px}
.filter-group{display:flex;flex-direction:column;gap:3px;flex:1;min-width:150px}
.filter-label{font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.5px}
.filter-group select{width:100%;max-width:none}
.filter-group select[multiple]{resize:none}
.metric-row{background:#fff;border-bottom:1px solid #e2e8f0;padding:8px 20px;display:flex;align-items:center;gap:12px}
.sep{width:1px;height:24px;background:#e2e8f0}
.radio-group{display:flex;gap:0;border:1px solid #cbd5e1;border-radius:6px;overflow:hidden}
.radio-group label{padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;color:#475569;background:#fff;border-right:1px solid #cbd5e1;user-select:none}
.radio-group label:last-child{border-right:none}
.radio-group label.active{background:#1d4ed8;color:#fff}
.metric-row select{padding:5px 8px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px;background:#fff;cursor:pointer;max-width:220px;width:100%}
.main{padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.pyr-section{background:#fff;border-radius:10px;padding:16px 20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pyr-header{display:grid;grid-template-columns:100px 1fr 100px 80px 100px 1fr 100px;margin-bottom:8px;align-items:end}
.ph-sublbl{font-size:10px;font-weight:700;padding-bottom:2px}
.ph-mdo{color:#64748b;text-align:right;padding-right:8px}
.ph-crf{color:#1d4ed8;text-align:left;padding-left:8px}
.ph-title{text-align:center;font-size:13px;font-weight:700}
.ph-region{color:#1d4ed8}
.ph-tn{color:#64748b}
.ph-pvp{text-align:center;font-size:10px;font-weight:700;color:#1d4ed8;letter-spacing:.5px;padding-bottom:2px}
.pyr-rows{display:flex;flex-direction:column;gap:4px}
.pyr-row{display:grid;grid-template-columns:100px 1fr 100px 80px 100px 1fr 100px;align-items:center}
.lbl{display:flex;flex-direction:column;justify-content:center;gap:1px}
.lbl-mdo{align-items:flex-end;text-align:right;padding-right:8px}
.lbl-crf{align-items:flex-start;text-align:left;padding-left:8px}
.lbl-pct{font-size:12px;font-weight:700}
.lbl-mdo .lbl-pct{color:#374151}
.lbl-crf .lbl-pct{color:#1d4ed8}
.lbl-val{font-size:10px;color:#94a3b8}
.row-svg{display:flex;justify-content:center}
.row-pvp{display:flex;justify-content:center;align-items:center}
.pvp-badge{padding:6px 0;border-radius:5px;color:#fff;font-size:10px;font-weight:700;text-align:center;width:76px}

/* Brand panel */
.brand-panel{display:flex;gap:8px;background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg-col{flex:1;min-width:0;display:flex;flex-direction:column}
.seg-header{padding:8px 10px;border-radius:6px 6px 0 0;color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:space-between}
.seg-stats{font-weight:400;font-size:11px;opacity:.9}
.seg-body{border:1px solid #e2e8f0;border-top:none;border-radius:0 0 6px 6px;overflow-y:auto;max-height:400px}
.brand-item{padding:8px 10px;border-bottom:1px solid #f1f5f9}
.brand-item.rec-bg{background:#fefce8}
.brand-item.one-reg{background:#fff7ed}
.brand-item.rec-bg.one-reg{background:#fef3c7}
.brand-top{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:3px}
.brand-name{font-weight:600;font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-pct{font-size:12px;font-weight:700;color:#1d4ed8;white-space:nowrap}
.brand-badges{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:3px}
.badge{padding:1px 5px;border-radius:3px;font-size:10px;font-weight:600}
.badge-crf{background:#dcfce7;color:#15803d}
.badge-ncrf{background:#fee2e2;color:#b91c1c}
.badge-rec{background:#fef9c3;color:#a16207}
.badge-1reg{background:#fed7aa;color:#c2410c}
.badge-multi{background:#e0e7ff;color:#3730a3}
.brand-detail{font-size:11px;color:#64748b;margin-top:1px}
.brand-eans{font-size:10px;color:#94a3b8;margin-top:1px}
.filter-bar{display:flex;gap:4px;padding:6px 10px;background:#f8fafc;border-bottom:1px solid #e2e8f0;flex-wrap:wrap}
.filt-btn{padding:2px 8px;border:1px solid #cbd5e1;border-radius:4px;background:#fff;font-size:11px;cursor:pointer;color:#475569}
.filt-btn.active{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.no-data{padding:20px;text-align:center;color:#94a3b8;font-size:12px}

.upload-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: rgba(255,255,255,.15);
  color: #fff !important;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s;
  border: 1px solid rgba(255,255,255,.4);
}
.upload-btn:hover { background: rgba(255,255,255,.28); }
.file-status { font-size: 11px; color: rgba(255,255,255,.75); white-space: nowrap; }
.file-status.loaded { color: #fff; font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="title-block">
    <h1 id="mainTitle">🔺 Pirámide de Segmentación — Carrefour</h1>
    <span id="subTitle">· Análisis por Región / Planograma / UN / Marca</span>
  </div>
  <label class="upload-btn">
    <input type="file" id="fileInput" accept=".xlsx" style="display:none">
    &#128194; Cargar Excel
  </label>
  <span class="file-status" id="fileStatus">Sin archivo cargado</span>
</header>
<div class="filters">
  <div class="filter-group">
    <span class="filter-label">Región</span>
    <select id="sel-region" size="4" onchange="render()"></select>
  </div>
  <div class="filter-group">
    <span class="filter-label">Planograma</span>
    <select id="sel-plano" multiple size="4"></select>
  </div>
  <div class="filter-group">
    <span class="filter-label">Unidad de Necesidad</span>
    <select id="sel-un" multiple size="4"></select>
  </div>
  <div class="filter-group">
    <span class="filter-label">Marca</span>
    <select id="sel-marca" multiple size="4"></select>
  </div>
</div>
<div class="metric-row">
  <div class="radio-group" id="metric-btns">
    <label class="active" onclick="setMetric('imp',this)">Facturación $</label>
    <label onclick="setMetric('uni',this)">Unidades</label>
    <label onclick="setMetric('ean',this)">EANs</label>
  </div>
  <div style="display:flex;flex-direction:column;gap:3px">
    <span class="filter-label">Sección</span>
    <select id="sel-seccion" onchange="onSeccionChange()" style="min-width:130px"></select>
  </div>
</div>
<div class="main">
  <div class="pyr-section">
    <div class="pyr-header" id="pyr-header"></div>
    <div class="pyr-rows" id="pyr-rows"></div>
  </div>
  <div class="brand-panel" id="brand-panel"></div>
</div>
<script>
// ============================================================
// Layout de columnas de la hoja "Export" (índices 0-based de XLSX.utils.sheet_to_json).
// Si en el futuro se agrega/quita una columna en el Excel, ajustar ÚNICAMENTE estos
// valores (COL y REGION_BASE_START) en vez de buscar números sueltos en todo el script.
// ============================================================
const COL = {
  SECCION:    1,  // columna B
  PLANOGRAMA: 2,
  UN:         3,
  MARCA:      6,
  RANGO:      21, // segmentación calculada a nivel planograma (sin UN)
  RANGO_UN:   22, // segmentación calculada a nivel UN
};

let META=null;
const RANGOS=['BAJO','MEDIO','ALTO','ALTA GAMA'];
const RCOLS={'ALTA GAMA':'#6d28d9','ALTO':'#1d4ed8','MEDIO':'#2563eb','BAJO':'#60a5fa'};
const RLGT={'ALTA GAMA':'#ede9fe','ALTO':'#dbeafe','MEDIO':'#bfdbfe','BAJO':'#eff6ff'};
const SHAPE={
  'BAJO':      {topF:0.80,botF:1.00},
  'MEDIO':     {topF:0.58,botF:0.80},
  'ALTO':      {topF:0.34,botF:0.58},
  'ALTA GAMA': {topF:0.12,botF:0.34},
};
const ROW_H=86;

let metric='imp';
function setMetric(m,el){
  metric=m;
  document.querySelectorAll('#metric-btns label').forEach(l=>l.classList.remove('active'));
  el.classList.add('active');
  render();
}

// Separador de miles con puntos (Argentina)
const fmtN = v => Math.round(v).toLocaleString('es-AR');
const fmt$  = v => v>0 ? '$'+fmtN(v) : '—';
const fmtP  = v => (+(v||0)).toFixed(1)+'%';

const selRegion=document.getElementById('sel-region');
const selSeccion=document.getElementById('sel-seccion');
const selPlano=document.getElementById('sel-plano');
const selUN=document.getElementById('sel-un');
const selMarca=document.getElementById('sel-marca');
let RAWROWS={};   // filas crudas por planograma, dentro de la Sección seleccionada
let ALLROWS=[];   // todas las filas del Excel (sin filtrar por Sección)
let currentNodeMap=null; // {rango:{region:nodo}} para la combinación Sección+Plano(s)+UN(s) actual
let prevPlanoSel=[]; // último estado de selección de Planograma (para exclusividad con TOTAL SURTIDO)

function getSelectedValues(sel){ return [...sel.selectedOptions].map(o=>o.value); }

// Si se tilda TOTAL SURTIDO junto con planogramas específicos, prevalece la última
// acción del usuario: tildar TOTAL destilda el resto, y tildar un planograma específico
// destilda TOTAL (son mutuamente excluyentes).
function enforceTotalExclusive(){
  const opts=[...selPlano.options];
  const cur=opts.filter(o=>o.selected).map(o=>o.value);
  const totalNow=cur.includes('__TOTAL__');
  const totalBefore=prevPlanoSel.includes('__TOTAL__');
  if(cur.length>1){
    if(totalNow && !totalBefore){
      opts.forEach(o=>{ if(o.value!=='__TOTAL__') o.selected=false; });
    } else if(totalNow){
      opts.forEach(o=>{ if(o.value==='__TOTAL__') o.selected=false; });
    }
  }
  prevPlanoSel=opts.filter(o=>o.selected).map(o=>o.value);
}
selPlano.addEventListener('change', function(){
  enforceTotalExclusive();
  onPlanoChange();
});
const mainTitleEl=document.getElementById('mainTitle');
const subTitleEl=document.getElementById('subTitle');
const BASE_TITLE=mainTitleEl.textContent;
const BASE_SUBTITLE=subTitleEl.textContent;

function populateSelectors(){
  selRegion.innerHTML='';
  META.regions.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;selRegion.appendChild(o);});
  selSeccion.innerHTML='';
  const oA=document.createElement('option');oA.value='';oA.textContent='— Todas —';selSeccion.appendChild(oA);
  META.secciones.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;selSeccion.appendChild(o);});
}

// Filas vigentes según la Sección elegida (todas las filas si no hay Sección seleccionada)
function getSeccionRows(){
  const sec=selSeccion.value;
  return sec ? ALLROWS.filter(r=>r[COL.SECCION]===sec) : ALLROWS;
}

// Al cambiar la Sección se reconstruye RAWROWS y la lista de Planogramas disponibles,
// y se reinicia la selección a TOTAL SURTIDO (dispara el resto de la cadena de filtros).
function onSeccionChange(){
  if(!META) return;
  const rows=getSeccionRows();
  const byPlano=new Map();
  rows.forEach(r=>{ const pl=r[COL.PLANOGRAMA]; if(!byPlano.has(pl)) byPlano.set(pl,[]); byPlano.get(pl).push(r); });
  RAWROWS=Object.fromEntries(byPlano);
  const planos=[...byPlano.keys()].sort();

  selPlano.innerHTML='';
  const oT=document.createElement('option');oT.value='__TOTAL__';oT.textContent='— TOTAL SURTIDO —';selPlano.appendChild(oT);
  planos.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;selPlano.appendChild(o);});
  oT.selected=true;
  prevPlanoSel=['__TOTAL__'];

  onPlanoChange();
}

function onPlanoChange(){
  if(!META) return;
  const selPlanos=getSelectedValues(selPlano);
  const isTotal=selPlanos.includes('__TOTAL__');
  selUN.innerHTML='';
  if(!isTotal && selPlanos.length){
    const unSet=new Set();
    selPlanos.forEach(pl=>{ (RAWROWS[pl]||[]).forEach(r=>unSet.add(r[COL.UN])); });
    [...unSet].sort().forEach(u=>{const o=document.createElement('option');o.value=u;o.textContent=u;selUN.appendChild(o);});
  }
  selUN.disabled = isTotal || !selPlanos.length;
  populateMarcaOptions();
  recalcCurrentNode();
  render();
}

function onUNChange(){
  populateMarcaOptions();
  recalcCurrentNode();
  render();
}

selUN.addEventListener('change', onUNChange);
selMarca.addEventListener('change', buildBrandPanel);

// Lista de marcas disponibles según Sección + Planograma(s) + UN(s) seleccionadas (para el filtro Marca)
function populateMarcaOptions(){
  selMarca.innerHTML='';
  if(!META) return;
  const selPlanos=getSelectedValues(selPlano);
  const isTotal=selPlanos.includes('__TOTAL__');
  let rows;
  if(isTotal || !selPlanos.length){ rows=getSeccionRows(); }
  else{
    const combined=selPlanos.reduce((a,pl)=>a.concat(RAWROWS[pl]||[]),[]);
    const selUNs=getSelectedValues(selUN);
    rows=selUNs.length?combined.filter(r=>selUNs.includes(r[COL.UN])):combined;
  }
  const marcas=[...new Set(rows.map(r=>r[COL.MARCA]))].sort();
  marcas.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;selMarca.appendChild(o);});
}

// Recalcula el mapa {rango:{region:nodo}} vigente según Sección + Planograma(s) + UN(s) seleccionadas.
// Siempre se recombinan dinámicamente las filas filtradas (mismo patrón ya usado para UN),
// agrupando por RANGO a nivel planograma (col 21) si no hay UN elegidas, o por RANGO_UN (col 22)
// si hay una o más UN seleccionadas.
function recalcCurrentNode(){
  if(!META){ currentNodeMap=null; return; }
  const selPlanos=getSelectedValues(selPlano);
  if(!selPlanos.length){ currentNodeMap=null; return; }
  const isTotal=selPlanos.includes('__TOTAL__');
  const baseRows = isTotal ? getSeccionRows() : selPlanos.reduce((a,pl)=>a.concat(RAWROWS[pl]||[]),[]);
  const selUNs = isTotal ? [] : getSelectedValues(selUN);
  const filtered = selUNs.length ? baseRows.filter(r=>selUNs.includes(r[COL.UN])) : baseRows;
  const rangoCol = selUNs.length ? COL.RANGO_UN : COL.RANGO;
  const out={};
  RANGOS.forEach(rango=>{
    const segRows=filtered.filter(r=>r[rangoCol]===rango);
    if(segRows.length) out[rango]=buildSegRegionMap(segRows);
  });
  currentNodeMap=out;
}

function getSeg(rango,region){
  if(!currentNodeMap) return null;
  try{ return currentNodeMap[rango][region]||null; }
  catch(e){ return null; }
}

function getVals(d){
  if(!d) return {mdo:0,crf:0,mdoPrice:0,crfPrice:0};
  if(metric==='imp') return {mdo:d.di||0,crf:d.ci||0,mdoPrice:d.pm||0,crfPrice:d.pc||0};
  if(metric==='uni') return {mdo:d.du||0,crf:d.cu||0,mdoPrice:d.pm||0,crfPrice:d.pc||0};
  return {mdo:d.em||0,crf:d.ec||0,mdoPrice:0,crfPrice:0};
}

function getDistrib(rango,region){
  let sC=0,sM=0,tC=0,tM=0;
  RANGOS.forEach(r=>{
    const d=getSeg(r,region);if(!d)return;
    const v=getVals(d);tC+=v.crf;tM+=v.mdo;
    if(r===rango){sC=v.crf;sM=v.mdo;}
  });
  return{crf:tC>0?sC/tC*100:0,mdo:tM>0?sM/tM*100:0};
}

function rowSVG(rango,region,W){
  const d=getSeg(rango,region);
  const sh=SHAPE[rango];
  const H=ROW_H,cx=W/2;
  const wTop=W*sh.topF,wBot=W*sh.botF;
  const x0=cx-wTop/2,x1=cx+wTop/2;
  const nx0=cx-wBot/2,nx1=cx+wBot/2;
  const col=RCOLS[rango],colL=RLGT[rango];
  let s=`<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="display:block">`;
  if(!d){
    s+=`<polygon points="${x0},0 ${x1},0 ${nx1},${H} ${nx0},${H}" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>`;
    s+=`<text x="${cx}" y="${H/2+4}" text-anchor="middle" font-size="10" fill="#94a3b8">Sin datos</text>`;
    return s+'</svg>';
  }
  // Fixed divider at center
  s+=`<polygon points="${x0},0 ${cx},0 ${cx},${H} ${nx0},${H}" fill="${colL}"/>`;
  s+=`<polygon points="${cx},0 ${x1},0 ${nx1},${H} ${cx},${H}" fill="${col}"/>`;
  s+=`<polygon points="${x0},0 ${x1},0 ${nx1},${H} ${nx0},${H}" fill="none" stroke="#fff" stroke-width="3"/>`;
  s+=`<line x1="${cx}" y1="0" x2="${cx}" y2="${H}" stroke="#fff" stroke-width="2" stroke-dasharray="5,3"/>`;
  const altoSh=SHAPE['ALTO'];
  const altoMinW=Math.min(W*altoSh.topF,W*altoSh.botF);
  const cardW=altoMinW*0.85,cardH=54,cardX=cx-cardW/2,cardY=H/2-cardH/2;
  s+=`<rect x="${cardX}" y="${cardY}" width="${cardW}" height="${cardH}" rx="4" fill="rgba(255,255,255,.92)" stroke="#cbd5e1" stroke-width="1"/>`;
  const totalEt=RANGOS.reduce((a,r)=>{const dd=getSeg(r,region);return a+(dd?dd.et:0);},0);
  const pctEan=totalEt>0?fmtP(d.et/totalEt*100):'';
  s+=`<text x="${cx}" y="${cardY+16}" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">${fmtN(d.et)} EANs</text>`;
  s+=`<text x="${cx}" y="${cardY+30}" text-anchor="middle" font-size="11" fill="#475569">${pctEan}</text>`;
  s+=`<text x="${cx}" y="${cardY+44}" text-anchor="middle" font-size="10" fill="#2563eb">MDO: ${fmtN(d.em)} | CRF: ${fmtN(d.ec)}</text>`;
  return s+'</svg>';
}

function lblCell(rango,region,side,minH){
  const d=getSeg(rango,region);
  const dist=getDistrib(rango,region);
  const v=getVals(d);
  const pct=side==='mdo'?fmtP(dist.mdo):fmtP(dist.crf);
  let sub='';
  if(metric==='imp') sub=side==='mdo'?fmt$(v.mdoPrice):fmt$(v.crfPrice);
  else if(metric==='uni') sub=side==='mdo'?fmtN(v.mdo)+' u':fmtN(v.crf)+' u';
  const cls=side==='mdo'?'lbl lbl-mdo':'lbl lbl-crf';
  return `<div class="${cls}" style="min-height:${minH}px">
    <span class="lbl-pct">${pct}</span>
    ${sub?`<span class="lbl-val">${sub}</span>`:''}
  </div>`;
}

function render(){
  if(!META) return;
  const region=selRegion.value;
  const isTot=getSelectedValues(selPlano).includes('__TOTAL__');
  const regionLabel=isTot?region+' · Total Surtido':region;
  const lbl={imp:'$ seg.',uni:'uni seg.',ean:'EANs seg.'};

  document.getElementById('pyr-header').innerHTML=`
    <div class="ph-sublbl ph-mdo">MDO ${lbl[metric]}</div>
    <div class="ph-title ph-region">${regionLabel}</div>
    <div class="ph-sublbl ph-crf">CRF ${lbl[metric]}</div>
    <div class="ph-pvp">RANGO</div>
    <div class="ph-sublbl ph-mdo">MDO ${lbl[metric]}</div>
    <div class="ph-title ph-tn">Total Nacional</div>
    <div class="ph-sublbl ph-crf">CRF ${lbl[metric]}</div>`;

  const rowsEl=document.getElementById('pyr-rows');
  const totalW=rowsEl.offsetWidth||1100;
  const svgW=Math.max(Math.floor((totalW-480)/2),140);

  let html='';
  [...RANGOS].reverse().forEach(rango=>{
    html+=`<div class="pyr-row">
      ${lblCell(rango,region,'mdo',ROW_H)}
      <div class="row-svg">${rowSVG(rango,region,svgW)}</div>
      ${lblCell(rango,region,'crf',ROW_H)}
      <div class="row-pvp"><span class="pvp-badge" style="background:${RCOLS[rango]}">${rango}</span></div>
      ${lblCell(rango,'TOTAL NACIONAL','mdo',ROW_H)}
      <div class="row-svg">${rowSVG(rango,'TOTAL NACIONAL',svgW)}</div>
      ${lblCell(rango,'TOTAL NACIONAL','crf',ROW_H)}
    </div>`;
  });
  rowsEl.innerHTML=html;
  buildBrandPanel();
}

const AF={};RANGOS.forEach(r=>AF[r]='all');
function setFilter(r,f){AF[r]=f;buildBrandPanel();}

function buildBrandPanel(){
  const region=selRegion.value;
  const selMarcas=getSelectedValues(selMarca);
  let html='';
  ['BAJO','MEDIO','ALTO','ALTA GAMA'].forEach(rango=>{
    const d=getSeg(rango,region),col=RCOLS[rango],af=AF[rango]||'all';
    html+=`<div class="seg-col">
    <div class="seg-header" style="background:${col}">
      <span>${rango}</span>
      <span class="seg-stats">${d?fmtN(d.nm)+' marcas · '+fmtN(d.et)+' EANs':'Sin datos'}</span>
    </div>
    <div class="filter-bar">
      <button class="filt-btn ${af==='all'?'active':''}"    onclick="setFilter('${rango}','all')">Todas</button>
      <button class="filt-btn ${af==='1reg'?'active':''}"   onclick="setFilter('${rango}','1reg')">1 región</button>
      <button class="filt-btn ${af==='multi'?'active':''}"  onclick="setFilter('${rango}','multi')">Multireg</button>
      <button class="filt-btn ${af==='nocrf'?'active':''}"  onclick="setFilter('${rango}','nocrf')">✕ No CRF</button>
      <button class="filt-btn ${af==='rec'?'active':''}"    onclick="setFilter('${rango}','rec')">★ Rec</button>
    </div>
    <div class="seg-body">`;
    if(!d||!d.marcas||!d.marcas.length){html+='<div class="no-data">Sin marcas con este filtro</div>';}
    else{
      let ms=selMarcas.length?d.marcas.filter(x=>selMarcas.includes(x.m)):d.marcas;
      if(af==='1reg')       ms=ms.filter(x=>(x.mr===1||x.cr===1));
      else if(af==='multi') ms=ms.filter(x=>x.mr>=2||x.cr>=2);
      else if(af==='nocrf') ms=ms.filter(x=>x.c===0);
      else if(af==='rec')   ms=ms.filter(x=>x.r===1);
      if(!ms.length) html+='<div class="no-data">Sin marcas con este filtro</div>';
      else ms.forEach(mk=>{
        const pct=metric==='uni'?mk.pu:mk.pi;
        const isOneReg=(mk.mr===1||mk.cr===1);
        const badges=[];
        if(mk.c) badges.push('<span class="badge badge-crf">✓ CRF</span>');
        else     badges.push('<span class="badge badge-ncrf">✕ CRF</span>');
        if(mk.r) badges.push('<span class="badge badge-rec">★ Recomendar</span>');
        if(isOneReg) badges.push('<span class="badge badge-1reg">1 región</span>');
        else if(mk.mr>=2||mk.cr>=2) badges.push('<span class="badge badge-multi">Multireg</span>');
        const regInfo=`MDO: ${mk.mr} reg · CRF: ${mk.cr} reg`;
        html+=`<div class="brand-item ${mk.r?'rec-bg':''} ${isOneReg?'one-reg':''}">
          <div class="brand-top">
            <span class="brand-name" title="${mk.m}">${mk.m}</span>
            <span class="brand-pct">${fmtP(pct)} seg.</span>
          </div>
          <div class="brand-badges">${badges.join('')}</div>
          <div class="brand-detail">MDO: ${fmt$(mk.ppm)} | CRF: ${fmt$(mk.ppc)}</div>
          <div class="brand-eans">EANs: ${fmtN(mk.et)} · CRF: ${fmtN(mk.ec)} · MDO: ${fmtN(mk.em)} · ${regInfo}</div>
        </div>`;
      });
    }
    html+='</div></div>';
  });
  document.getElementById('brand-panel').innerHTML=html;
}

document.getElementById('pyr-rows').innerHTML =
  '<div class="no-data" style="padding:48px;text-align:center;width:100%;grid-column:1/-1">'
  + '\uD83D\uDCC2 Carg\u00e1 un archivo Excel (.xlsx) con la hoja "Export" para visualizar la pir\u00e1mide de segmentaci\u00f3n.</div>';

// ============================================================
// Carga y parseo del Excel (reemplaza los datos hardcodeados)
// ============================================================
// Cada región ocupa un bloque de 12 columnas consecutivas (r[b], r[b+3], r[b+6], r[b+9]).
// REGION_BASE_START = columna de 'TOTAL NACIONAL'; el resto se calcula sumando el ancho
// del bloque (REGION_STEP) — así, si se inserta una columna antes de estos bloques, sólo
// hay que tocar REGION_BASE_START (o COL, arriba) y no cada número por separado.
const REGION_BASE_START = 23;
const REGION_STEP = 12;
const SUBREGIONS  = ['NOA','LITORAL','CUYO','CORDOBA','BS AS','PATAGONIA'];
const REGIONS_ALL = ['TOTAL NACIONAL'].concat(SUBREGIONS);
const REGION_BASE = {};
REGIONS_ALL.forEach((region,i)=>{ REGION_BASE[region] = REGION_BASE_START + i*REGION_STEP; });

function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }
function round2(v){ return Math.round(v*100)/100; }

// Construye el nodo agregado {et,ec,em,ci,cu,di,du,pci,pmi,pcu,pmu,pc,pm,nm,ncrf,nnc,nrec,marcas}
// para un conjunto de filas (ya filtradas por planograma+UN+rango) y una región dada.
function buildNode(rowsArr, region){
  const b = REGION_BASE[region];
  const active = rowsArr.filter(r => num(r[b+3])+num(r[b+9]) > 0);
  const et = active.length;
  const ec = active.filter(r=>num(r[b+3])>0).length;
  const em = active.filter(r=>num(r[b+9])>0).length;
  let ci=0,cu=0,di=0,du=0;
  active.forEach(r=>{ ci+=num(r[b]); cu+=num(r[b+3]); di+=num(r[b+6]); du+=num(r[b+9]); });
  const totImp = ci+di, totUni = cu+du;
  const pci = totImp>0 ? round2(ci/totImp*100) : 0;
  const pmi = totImp>0 ? round2(di/totImp*100) : 0;
  const pcu = totUni>0 ? round2(cu/totUni*100) : 0;
  const pmu = totUni>0 ? round2(du/totUni*100) : 0;
  const pc  = cu>0 ? round2(ci/cu) : 0;
  const pm  = du>0 ? round2(di/du) : 0;

  const byMarca = new Map();
  active.forEach(r=>{
    const m = r[COL.MARCA];
    if(!byMarca.has(m)) byMarca.set(m, []);
    byMarca.get(m).push(r);
  });

  const marcas = [];
  byMarca.forEach((brows, mname)=>{
    let bci=0,bcu=0,bdi=0,bdu=0;
    brows.forEach(r=>{ bci+=num(r[b]); bcu+=num(r[b+3]); bdi+=num(r[b+6]); bdu+=num(r[b+9]); });
    const piRaw = totImp>0 ? (bci+bdi)/totImp*100 : 0;
    const puRaw = totUni>0 ? (bcu+bdu)/totUni*100 : 0;
    const c  = bcu>0 ? 1 : 0;
    const rf = (c===0 && piRaw>=3) ? 1 : 0;
    const pp  = (bcu+bdu)>0 ? round2((bci+bdi)/(bcu+bdu)) : 0;
    const ppc = bcu>0 ? round2(bci/bcu) : 0;
    const ppm = bdu>0 ? round2(bdi/bdu) : 0;
    const bet = brows.length;
    const bec = brows.filter(r=>num(r[b+3])>0).length;
    const bem = brows.filter(r=>num(r[b+9])>0).length;

    let e2;
    if(region === 'TOTAL NACIONAL'){
      e2 = brows.filter(r=>{
        if(num(r[b+9])<=0) return false;
        let pres=0;
        SUBREGIONS.forEach(sr=>{ if(num(r[REGION_BASE[sr]+9])>0) pres++; });
        return pres>=2;
      }).length;
    } else {
      e2 = bem;
    }

    // mr/cr: cantidad de regiones (de las 6 sub-regiones) en las que la marca tiene
    // alguna venta MDO/CRF, calculado sobre TODAS las filas del segmento (no solo las activas
    // en la región actual) — por eso el valor es constante entre vistas de región.
    const allBrandRows = rowsArr.filter(r=>r[COL.MARCA]===mname);
    const mr = SUBREGIONS.filter(sr=>allBrandRows.some(r=>num(r[REGION_BASE[sr]+9])>0)).length;
    const cr = SUBREGIONS.filter(sr=>allBrandRows.some(r=>num(r[REGION_BASE[sr]+3])>0)).length;

    marcas.push({m:mname, pi:round2(piRaw), pu:round2(puRaw), c:c, r:rf, pp:pp, ppc:ppc, ppm:ppm,
                 et:bet, e2:e2, ec:bec, em:bem, mr:mr, cr:cr});
  });
  marcas.sort((a,b)=>b.pi-a.pi);

  const nm   = marcas.length;
  const ncrf = marcas.filter(x=>x.c===1).length;
  const nnc  = marcas.filter(x=>x.c===0).length;
  const nrec = marcas.filter(x=>x.r===1).length;

  return {et:et, ec:ec, em:em, ci:Math.round(ci), cu:Math.round(cu), di:Math.round(di), du:Math.round(du),
          pci:pci, pmi:pmi, pcu:pcu, pmu:pmu, pc:pc, pm:pm,
          nm:nm, ncrf:ncrf, nnc:nnc, nrec:nrec, marcas:marcas};
}

function buildSegRegionMap(rowsArr){
  const out = {};
  REGIONS_ALL.forEach(region=>{ out[region] = buildNode(rowsArr, region); });
  return out;
}

function parseWorkbook(wb){
  const ws = wb.Sheets['Export'];
  if(!ws){ setStatus('\u2717 No se encontr\u00f3 la hoja "Export"', false); return; }

  const a1 = ws['A1'] ? String(ws['A1'].v).trim() : '';
  const b1 = ws['B1'] ? String(ws['B1'].v).trim() : '';
  mainTitleEl.textContent = b1 ? `${BASE_TITLE} ${b1}` : BASE_TITLE;
  subTitleEl.textContent = a1 ? `${a1} ${BASE_SUBTITLE}` : BASE_SUBTITLE;

  const allRows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
  // Las primeras 3 filas son encabezados (igual que en Participacion_Barras.html)
  // Layout de columnas: ver constante COL al inicio del script.
  const dataRows = allRows.slice(3).filter(r=>r[COL.PLANOGRAMA] && r[COL.UN] && r[COL.MARCA]);
  if(!dataRows.length){ setStatus('\u2717 No se encontraron datos en la hoja Export', false); return; }

  dataRows.forEach(r=>{
    r[COL.SECCION]    = String(r[COL.SECCION]||'').trim();
    r[COL.PLANOGRAMA] = String(r[COL.PLANOGRAMA]).trim();
    r[COL.UN]         = String(r[COL.UN]).trim();
    r[COL.MARCA]      = String(r[COL.MARCA]).trim();
    r[COL.RANGO]      = String(r[COL.RANGO]||'').trim();
    r[COL.RANGO_UN]   = String(r[COL.RANGO_UN]||'').trim();
  });

  ALLROWS = dataRows;
  const secciones = [...new Set(dataRows.map(r=>r[COL.SECCION]).filter(Boolean))].sort();

  META = {regions: REGIONS_ALL.slice(), secciones: secciones};

  populateSelectors();
  onSeccionChange();
}

document.getElementById('fileInput').addEventListener('change', function () {
  const file = this.files[0];
  if (!file) return;
  setStatus('Procesando...', false);
  const reader = new FileReader();
  reader.onload = function (e) {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      parseWorkbook(wb);
      setStatus('\u2713 ' + file.name, true);
    } catch (err) {
      setStatus('\u2717 Error al procesar: ' + err.message, false);
    }
  };
  reader.onerror = () => setStatus('\u2717 Error al leer el archivo', false);
  reader.readAsArrayBuffer(file);
});
function setStatus(msg, ok) {
  const st = document.getElementById('fileStatus');
  st.textContent = msg;
  st.className = 'file-status' + (ok ? ' loaded' : '');
}
